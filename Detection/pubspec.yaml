name: campus_go
description: Smart College Bus Tracking System - SREC Bus Management
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0

  # Location & GPS
  geolocator: ^11.0.0

  # Maps
  google_maps_flutter: ^2.5.3

  # Icons
  cupertino_icons: ^1.0.6
  intl: ^0.20.2
  google_fonts: ^8.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
